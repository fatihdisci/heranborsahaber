name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sector/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run kit:export
      - run: npm test
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pdf.txt
      - run: python -m unittest discover -s test -p 'test_*.py'
  macos-ocr:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pdf.txt
      - run: swiftc -O scripts/pdf_ocr.swift -o /tmp/pdf-ocr
      - run: python -m unittest discover -s test -p 'test_macos_ocr.py'
        env:
          SECTOR_TEST_OCR_BINARY: /tmp/pdf-ocr
